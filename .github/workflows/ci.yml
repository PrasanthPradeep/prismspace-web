name: PrismSpace CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, types, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  python:
    name: Python checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend and model dependencies
        run: python -m pip install -r backend/requirements.txt -r model/requirements-api.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q backend model
      - name: Run dependency-light backend tests
        run: python -m pytest backend/test_react_loop.py backend/test_self_correction.py -q
      - name: Run model pipeline tests
        run: python -m unittest model/test_pipeline.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: npm ci
      # This is report-only until the existing dependency baseline is reduced.
      - run: npm audit --audit-level=high
      - run: python -m pip install pip-audit
      - run: pip-audit -r backend/requirements.txt -r model/requirements-api.txt

  images:
    name: Build and scan container images
    runs-on: ubuntu-latest
    needs: [frontend, python, secrets]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build Alloy collector image
        run: docker build -f monitoring/Dockerfile -t prismspace-alloy:ci monitoring
      - name: Scan Alloy collector image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: prismspace-alloy:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Build model image when artifacts are available
        if: ${{ hashFiles('model/artifacts/**') != '' }}
        run: docker build -f model/Dockerfile -t prismspace-model-api:ci .
      - name: Scan model image when artifacts are available
        if: ${{ hashFiles('model/artifacts/**') != '' }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: prismspace-model-api:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  runtime-smoke:
    name: Production runtime smoke tests
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ always() && needs.deploy.result == 'success' && vars.SMOKE_TESTS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check frontend, backend, and model health
        env:
          SMOKE_FRONTEND_URL: ${{ secrets.SMOKE_FRONTEND_URL }}
          SMOKE_BACKEND_URL: ${{ secrets.SMOKE_BACKEND_URL }}
          SMOKE_MODEL_API_URL: ${{ secrets.SMOKE_MODEL_API_URL }}
          SMOKE_MODEL_API_KEY: ${{ secrets.SMOKE_MODEL_API_KEY }}
          SMOKE_BACKEND_METRICS_TOKEN: ${{ secrets.SMOKE_BACKEND_METRICS_TOKEN }}
          SMOKE_MODEL_METRICS_TOKEN: ${{ secrets.SMOKE_MODEL_METRICS_TOKEN }}
        run: node .github/scripts/smoke-test.mjs

  deploy:
    name: Deploy after CI
    runs-on: ubuntu-latest
    needs: [frontend, python, secrets, images]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_DEPLOY_ENABLED == 'true' }}
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        run: curl --fail-with-body --retry 3 --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
